name: Deploy to ECS

on: 
 push:

    branches: [main]


permissions: 
      id-token: write
      contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::750390205515:role/it-tools-github-actions-role
    

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Docker build and push image
        run: |
          docker build -t "750390205515.dkr.ecr.eu-north-1.amazonaws.com/it-tools:latest" .
          docker push "750390205515.dkr.ecr.eu-north-1.amazonaws.com/it-tools:latest" 

      - name: Force new ECS deployment
        run: 
          aws ecs update-service --cluster it-tools-cluster --service it-tools-service --force-new-deployment